[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qorch"
version = "1.0.0"
description = "QS-004 Quantum Orchestration Layer — hardware-agnostic control plane for quantum execution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "JJISPL Quantum Technologies" }]
keywords = ["quantum", "quantum-computing", "transpiler", "simulator", "qec", "error-mitigation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# The M1 vertical slice is intentionally dependency-free (ADR-6).
dependencies = []

[project.urls]
Homepage = "https://github.com/jjinfotechsolutionspvtltd-oss/qorch"
Repository = "https://github.com/jjinfotechsolutionspvtltd-oss/qorch"
Issues = "https://github.com/jjinfotechsolutionspvtltd-oss/qorch/issues"

[project.optional-dependencies]
# M2+: real-QPU adapters and transpiler reuse layer in.
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.14"]
braket = ["amazon-braket-sdk>=1.70"]
# UNVERIFIED: the GPU kernel has never been run on a CUDA device by its authors.
# See qorch.backends.gpu_kernel — the algorithm is tested against numpy, the
# CuPy binding is not. Pick the wheel matching your CUDA version.
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.8", "numpy>=1.24", "qiskit>=1.0", "qiskit-aer>=0.14"]
docs = ["pdoc>=14.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/qorch"]

[project.scripts]
qorch = "qorch.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/qorch"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin the rule set explicitly instead of inheriting ruff's defaults. CI installs
# ruff unpinned (`ruff>=0.5`), so a default-set change upstream lands as a red
# build on an unrelated PR — ruff 0.16 adding isort (I001) flagged 115
# pre-existing import blocks across the repo, none of them new code. These four
# are the defaults the codebase was written against; adopting isort is a
# deliberate repo-wide reformat, not something a dependency bump should force.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "benchmarks/"]

# Optional heavy dependencies are used lazily behind the HAL and typed as Any.
# Skip following into them so the type check is deterministic whether or not the
# optional extras are installed (and immune to upstream stub/version drift, e.g.
# newer numpy stubs using PEP 695 `type` aliases).
[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "qiskit.*", "qiskit_aer.*", "qiskit_ibm_runtime.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
