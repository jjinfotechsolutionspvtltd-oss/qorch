name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC). There is no API token stored
# in this repository and no secret to leak or rotate: GitHub mints a
# short-lived identity token for this exact workflow, and PyPI accepts it only
# for the publisher configured on the project side.
#
# Fires automatically when a GitHub Release is published. The manual trigger
# exists because a release that already went out cannot retroactively fire the
# `release` event — v1.0.0 shipped before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag, never a moving branch: what gets uploaded to PyPI
          # must be the tree the tag names, since a version can never be
          # replaced once published.
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A protected environment means the upload can require your approval before
    # it runs. PyPI uploads are irreversible, so the gate is worth the click.
    environment:
      name: pypi
      url: https://pypi.org/p/qorch
    permissions:
      id-token: write  # required for OIDC; this is what replaces the token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
